# Each service is independent: start one with `docker compose up --build backend`
# or `docker compose up --build frontend`, or both with `docker compose up --build`.
services:
  backend:
    build: ./backend
    container_name: nursery-backend
    # Database credentials (DB_USER, DB_PASSWORD, DB_NAME...) come from backend/.env
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      PORT: 3000
      API_PREFIX: api
      CORS_ORIGIN: http://localhost:4200
      # PostgreSQL runs on the host machine, not in a container
      DB_HOST: host.docker.internal
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '3000:3000'

  frontend:
    build: ./frontend
    container_name: nursery-frontend
    ports:
      - '4200:80'
